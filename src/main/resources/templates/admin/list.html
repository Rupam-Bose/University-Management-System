<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admins – University Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .table-card { border: none; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
        .table thead { background: linear-gradient(135deg, #533483, #0f3460); color: white; }
        .badge-admin { background-color: #dc3545; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #533483, #0f3460);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">🎓 University MS</a>
        <div class="d-flex align-items-center gap-3">
            <a href="/profile" class="btn btn-outline-light btn-sm">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
            <span class="text-white opacity-75 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
            <h4 class="fw-bold mb-0">👑 Administrators</h4>
            <p class="text-muted small mb-0">All registered admin accounts</p>
        </div>
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card table-card">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th class="px-4 py-3">#</th>
                        <th class="py-3">Name</th>
                        <th class="py-3">Email</th>
                        <th class="py-3">Role</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(admins)}">
                        <td colspan="4" class="text-center text-muted py-4">No admins found.</td>
                    </tr>
                    <tr th:each="admin : ${admins}">
                        <td class="px-4 py-3 text-muted" th:text="${admin.id}">1</td>
                        <td class="py-3 fw-semibold">
                            <span th:text="${admin.name}">Name</span>
                            <span th:if="${currentUser != null && currentUser.id == admin.id}"
                                  class="badge bg-secondary ms-1 small">You</span>
                        </td>
                        <td class="py-3" th:text="${admin.email}">email@example.com</td>
                        <td class="py-3">
                            <span class="badge badge-admin">ADMIN</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white text-muted small border-top px-4 py-2"
             th:text="'Total: ' + ${#lists.size(admins)} + ' admin(s)'">Total: 0 admin(s)</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
