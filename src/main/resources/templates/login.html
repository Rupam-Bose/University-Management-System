<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – University Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 420px;
        }
        .login-card .card-header {
            background: linear-gradient(135deg, #533483, #0f3460);
            border-radius: 16px 16px 0 0;
            padding: 2rem;
            text-align: center;
            color: white;
        }
        .login-card .card-header h3 {
            margin-bottom: 0.25rem;
            font-weight: 700;
        }
        .login-card .card-body {
            padding: 2rem;
        }
        .btn-login {
            background: linear-gradient(135deg, #533483, #0f3460);
            border: none;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .form-control:focus {
            border-color: #533483;
            box-shadow: 0 0 0 0.2rem rgba(83, 52, 131, 0.25);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-card card mx-auto">
        <div class="card-header">
            <div class="mb-2" style="font-size:2.5rem;">🎓</div>
            <h3>University MS</h3>
            <p class="mb-0 opacity-75">Sign in to your account</p>
        </div>
        <div class="card-body">
            <!-- Error alert -->
            <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Login failed.</strong> Invalid email or password.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <!-- Logout alert -->
            <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>Logged out</strong> successfully.
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="username" name="username"
                           placeholder="you@university.edu" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-login btn-primary text-white">Sign In</button>
                </div>
            </form>

            <hr class="my-3">
            <p class="text-center text-muted small mb-0">
                Default credentials: <code>admin@uni.com</code> / <code>admin123</code>
            </p>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
