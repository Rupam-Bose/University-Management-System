<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Navbar Fragment</title>
</head>
<body>

<!-- Reusable Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark"
     style="background: linear-gradient(135deg, #533483, #0f3460);">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/dashboard">🎓 University MS</a>
        <div class="d-flex align-items-center gap-3">
            <a href="/profile" class="btn btn-outline-light btn-sm">
                <i class="bi bi-person-circle"></i> My Profile
            </a>
            <span class="text-white opacity-75 small" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </form>
        </div>
    </div>
</nav>

</body>
</html>
