name: University Management System CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Docker Verification
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 (Temurin) with Maven caching
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Ensure Maven wrapper script has executable permissions
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      # Step 4: Run all Unit and Integration Tests
      - name: Run Unit & Integration Tests
        run: ./mvnw test
        continue-on-error: true

      # Step 5: Package into executable JAR file
      - name: Package Application (JAR)
        run: ./mvnw package -DskipTests

      # Step 6: Verify Docker container build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: docker compose build
